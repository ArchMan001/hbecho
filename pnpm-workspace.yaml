# pnpm 11：未审批的依赖构建脚本会让 install 失败，因此每一项都要明确决定。
allowBuilds:
  # 阿里云短信官方 SDK（@alicloud/dysmsapi20170525）的依赖。postinstall 只为 Node 10/12 额外 npm install TypeScript 与 @types/node，
  # 本项目 Node 24 时脚本直接退出，不需要运行（2026-11-10 核对 scripts/ts_version.js）。
  "@alicloud/openapi-core": false
  # esbuild 的 postinstall 只做二进制校验；平台预编译包已作为 optionalDependencies 装好，不需要运行。
  esbuild: false
