<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>hbecho · 学习平台 · 界面原型</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <dialog id="modal" class="modal" aria-labelledby="modal-title">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="modal-title">确认</h2>
          <button type="button" class="icon-btn" data-action="close-modal" aria-label="关闭">×</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-foot" class="modal-foot"></div>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
